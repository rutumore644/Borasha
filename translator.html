<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borasha | Translator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <div class="brand-mark">🌸</div>
                <div>
                    <h1>Borasha</h1>
                    <small>Learn • Practice • Speak</small>
                </div>
            </div>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="lessons.html">Lessons</a>
                <a href="vocabulary.html">Vocabulary</a>
                <a href="practice.html">Speak</a>
                <a href="translator.html" class="active">Translate</a>
                <a href="quiz.html">Quiz</a>
                <a href="progress.html">Progress</a>
                <a href="feedback.html">Feedback</a>
            </nav>
        </div>
    </header>

    <main class="container page-section">
        <div class="section-head center">
            <span class="eyebrow">Translator</span>
            <h3>Translate and speak</h3>
        </div>

        <div class="card-panel translator-box">
            <div class="translator-controls">
                <textarea id="translationInput" rows="5" placeholder="Type text here..."></textarea>
                <div class="button-row">
                    <button id="translateBtn" class="btn btn-primary">Translate</button>
                    <button id="micBtn" class="btn btn-secondary">🎤 Speak</button>
                </div>
            </div>

            <div class="translation-output">
                <h4>Result</h4>
                <p id="translationResult">Your translation will appear here.</p>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <h3>🌸 Borasha</h3>
            <p>Learn local languages at your own pace.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
