<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borasha | Progress</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <div class="brand-mark" aria-label="Borasha language logo"><span class="brand-letter">A</span><span class="brand-letter local">अ</span></div>
                <div>
                    <h1>Borasha</h1>
                    <small>Learn • Practice • Speak</small>
                </div>
            </div>

            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="lessons.html">Lessons</a>
                <a href="vocabulary.html">Vocabulary</a>
                <a href="practice.html">Speak</a>
                <a href="translator.html">Translate</a>
                <a href="quiz.html">Quiz</a>
                <a href="progress.html" class="active">Progress</a>
                <a href="feedback.html">Survey</a>
            </nav>
        </div>
    </header>

    <main class="container page-section">
        <div class="section-head center">
            <span class="eyebrow">Your Progress</span>
            <h3>Learning summary</h3>
        </div>

        <div class="card-panel progress-panel">
            <div class="progress-row">
                <span>Completed lessons</span>
                <strong id="completedLessonsCount">0</strong>
            </div>
            <div class="progress-row">
                <span>Quiz score</span>
                <strong id="quizScoreText">0 / 0</strong>
            </div>
            <div class="progress-row">
                <span>Learning level</span>
                <strong id="learningLevel">Beginner</strong>
            </div>

            <div class="progress-bar large">
                <div id="overallProgress" class="progress-fill"></div>
            </div>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <h3>🌸 Borasha</h3>
            <p>Learn local languages at your own pace.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
