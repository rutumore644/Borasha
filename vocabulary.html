<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Borasha | Vocabulary</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <div class="brand">
                <div class="brand-mark" aria-label="Borasha flower logo">🌸</div>
                <div>
                    <h1>Borasha</h1>
                    <small>Learn • Practice • Speak</small>
                </div>
            </div>
            <nav class="main-nav">
                <a href="index.html">Home</a>
                <a href="lessons.html">Lessons</a>
                <a href="vocabulary.html" class="active">Vocabulary</a>
                <a href="practice.html">Speak</a>
                <a href="translator.html">Translate</a>
                <a href="quiz.html">Quiz</a>
                <a href="progress.html">Progress</a>
                <a href="feedback.html">Survey</a>
            </nav>
        </div>
    </header>

    <main class="container page-section">
        <div class="section-head center">
            <span class="eyebrow">Learn Everyday Words</span>
            <h3>Vocabulary</h3>
            <p>Explore useful Marathi, Hindi and English words by topic.</p>
        </div>

        <div class="vocab-controls">
            <input type="search" id="vocabSearch" placeholder="Search a word... / शब्द खोजें..." aria-label="Search vocabulary">
            <div class="vocab-filters" id="vocabFilters"></div>
        </div>

        <p class="vocab-count" id="vocabCount"></p>
        <div class="vocab-grid" id="vocabGrid"></div>
        <p class="vocab-empty" id="vocabEmpty" hidden>No words found. Try another word or category.</p>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <h3>🌸 Borasha</h3>
            <p>Learn local languages at your own pace.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
